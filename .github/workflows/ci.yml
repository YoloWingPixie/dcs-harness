name: Harness CI

on:
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - "**/*.lua"
      - "**/*.py"
      - ".github/workflows/ci.yml"
      - ".buildrc"
      - "**/*.toml"
      - "**/.python-version"
      - "**/Taskfile.yml"
      - "uv.lock"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LUA_VERSION: 5.1
  ARTIFACT_NAME: harness.lua
  ARTIFACT_DIR: dist

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5

      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.12"
          enable-cache: false

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Setup Task
        id: setup-task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: "3.53.1"

      - name: Set up Lua ${{ env.LUA_VERSION }}
        id: setup-lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "${{ env.LUA_VERSION }}"

      - name: Cache Lua toolchain
        id: cache-lua
        uses: actions/cache@v4
        with:
          path: .lua
          key: lua-${{ runner.os }}-${{ env.LUA_VERSION }}-ghactionslua-v10

      - name: Format
        id: format
        run: |
          chmod +x stylua/stylua || true
          task format:check

      - name: Test
        id: test
        run: task test

      - name: Lua complexity
        id: complexity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          task complexity:check -- \
            --base-ref "$BASE_SHA" \
            --github-annotations \
            --markdown-report "$RUNNER_TEMP/lua-complexity.md" \
            --json-report "$RUNNER_TEMP/lua-complexity.json"

      - name: Build
        id: build
        run: task build:cd

      - name: Syntax check
        id: syntax-check
        run: task syntax:check

      - name: Lua 5.1 compatibility check
        id: lua51-compat
        run: |
          ERRORS=0
          f='${{ env.ARTIFACT_DIR }}/${{ env.ARTIFACT_NAME }}'
          if grep -nP '\b(string\.pack|string\.unpack|string\.packsize|table\.move|table\.pack|table\.unpack|utf8\.)' "$f"; then
            echo "::error file=$f::Found Lua 5.2+ stdlib function - not available in DCS Lua 5.1"
            ERRORS=1
          fi
          if grep -nP '\bbit32\.' "$f"; then
            echo "::error file=$f::Found bit32 - not available in Lua 5.1"
            ERRORS=1
          fi
          exit $ERRORS

      - name: Verify version stamped
        id: version-stamp-check
        run: |
          if grep -q '{{VERSION}}' '${{ env.ARTIFACT_DIR }}/${{ env.ARTIFACT_NAME }}'; then
            echo "::error::{{VERSION}} placeholder found in ${{ env.ARTIFACT_NAME }}"
            exit 1
          fi

      - name: Lint
        id: lint
        continue-on-error: true
        uses: YoloWingPixie/selene-lua-linter-action@v1
        with:
          config-path: "selene.toml"
          lint-path: "${{ env.ARTIFACT_DIR }}/${{ env.ARTIFACT_NAME }}"
          report-as-annotations: "false"
          selene-args: "--display-style Json"
          working-directory: "."

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const testResult = '${{ steps.test.outcome }}';
            const complexityResult = '${{ steps.complexity.outcome }}';
            const buildResult = '${{ steps.build.outcome }}';
            const syntaxResult = '${{ steps.syntax-check.outcome }}';
            const compatResult = '${{ steps.lua51-compat.outcome }}';
            const stampResult = '${{ steps.version-stamp-check.outcome }}';
            const lintResult = '${{ steps.lint.outcome }}';

            const icon = (r) => r === 'success' ? '✅' : '❌';

            let body = `## CI Results\n\n`;
            body += `| Check | Result |\n|-------|--------|\n`;
            body += `| Tests | ${icon(testResult)} ${testResult} |\n`;
            body += `| Lua complexity | ${icon(complexityResult)} ${complexityResult} |\n`;
            body += `| Build | ${icon(buildResult)} ${buildResult} |\n`;
            body += `| Syntax | ${icon(syntaxResult)} ${syntaxResult} |\n`;
            body += `| Lua 5.1 compat | ${icon(compatResult)} ${compatResult} |\n`;
            body += `| Version stamp | ${icon(stampResult)} ${stampResult} |\n`;
            body += `| Lint | ${icon(lintResult)} ${lintResult} |\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## CI Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Compute artifact name
        id: compute-artifact-name
        run: |
          set -e
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "ARTIFACT_NAME_SHA=harness.lua-${SAFE_REF_NAME}-${GITHUB_RUN_ID}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Rename build artifact with SHA
        id: rename
        run: |
          set -e
          mv '${{ env.ARTIFACT_DIR }}/${{ env.ARTIFACT_NAME }}' '${{ env.ARTIFACT_DIR }}/${{ env.ARTIFACT_NAME_SHA }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        id: upload
        with:
          name: "${{ env.ARTIFACT_NAME_SHA }}"
          path: "${{ env.ARTIFACT_DIR }}/${{ env.ARTIFACT_NAME_SHA }}"
          retention-days: 14

      - name: Log artifact digest
        run: |
          echo "### Artifact Digest" >> "$GITHUB_STEP_SUMMARY"
          echo "- harness: \`${{ steps.upload.outputs.artifact-digest }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if critical checks failed
        run: |
          if [ "${{ steps.test.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ] || \
             [ "${{ steps.syntax-check.outcome }}" != "success" ] || \
             [ "${{ steps.version-stamp-check.outcome }}" != "success" ]; then
            echo "::error::Critical checks failed"
            exit 1
          fi
