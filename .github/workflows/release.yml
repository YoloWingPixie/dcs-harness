name: Harness Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  ARTIFACT_NAME: harness.lua
  ARTIFACT_ZIP: harness.zip
  BUILD_DIR: ./dist

permissions: {}

jobs:
  release-guard:
    name: Guard - Tag points to main
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine if tag commit is on main
        id: check
        shell: bash
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    needs: release-guard
    if: needs.release-guard.outputs.on_main == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Setup Task
        uses: arduino/setup-task@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Verify tag matches pyproject.toml version
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e
          TAG_VERSION="${REF_NAME#v}"
          FILE_VERSION=$(python -c "
          import re; from pathlib import Path
          m = re.search(r'version\s*=\s*\"(\d+\.\d+\.\d+)\"', Path('pyproject.toml').read_text())
          print(m.group(1) if m else '')
          ")
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml ($FILE_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"

      - name: Verify changelog section is non-empty
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e
          VERSION="${REF_NAME#v}"
          SECTION=$(python -c "
          import re; from pathlib import Path
          content = Path('CHANGELOG.md').read_text()
          version = '$VERSION'
          pat = re.compile(rf'(?ms)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)')
          m = pat.search(content)
          body = m.group(1).strip() if m else ''
          has_entries = bool(re.search(r'^\s*[-*]', body, re.MULTILINE))
          print('yes' if has_entries else 'no')
          ")
          if [ "$SECTION" != "yes" ]; then
            echo "::error::CHANGELOG.md has no entries for version $VERSION"
            exit 1
          fi
          echo "Changelog section for $VERSION is non-empty"

      - name: Format check
        run: |
          chmod +x stylua/stylua || true
          task format:check

      - name: Test
        run: task test

      - name: Build
        run: task build:cd

      - name: Syntax check
        run: task syntax:check

      - name: Verify version stamped
        run: |
          if grep -q '{{VERSION}}' '${{ env.BUILD_DIR }}/${{ env.ARTIFACT_NAME }}'; then
            echo "::error::{{VERSION}} placeholder found in ${{ env.ARTIFACT_NAME }}"
            exit 1
          fi

      - name: Lint
        uses: YoloWingPixie/selene-lua-linter-action@v1
        with:
          config-path: 'selene.toml'
          lint-path: '${{ env.BUILD_DIR }}/${{ env.ARTIFACT_NAME }}'
          report-as-annotations: 'true'
          working-directory: '.'

  release:
    name: Release on main tags only
    runs-on: ubuntu-24.04
    needs: validate
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Setup Task
        uses: arduino/setup-task@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Build
        run: task build:cd

      - name: Zip artifact
        run: |
          cd '${{ env.BUILD_DIR }}'
          zip '${{ env.ARTIFACT_ZIP }}' '${{ env.ARTIFACT_NAME }}'

      - name: Generate checksums
        run: |
          cd '${{ env.BUILD_DIR }}'
          sha256sum '${{ env.ARTIFACT_ZIP }}' > SHA256SUMS.txt

      - name: Extract release notes
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          python ./build/scripts/extract_changelog_section.py "$REF_NAME" CHANGELOG.md RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'Release ${{ github.ref_name }}'
          make_latest: true
          prerelease: false
          draft: false
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            ${{ env.BUILD_DIR }}/${{ env.ARTIFACT_ZIP }}
            ${{ env.BUILD_DIR }}/SHA256SUMS.txt
            LICENSE
