version: '3'

vars:
  TEST_DIR: tests
  BUILD_DIR: dist
  SRC_DIR: src

tasks:
  default:
    desc: Run all tests
    cmds:
      - task: test

  tools:prepare:
    internal: true
    cmds:
      - cmd: chmod +x tools/selene/selene
        platforms: [linux, darwin]

  test:
    deps: [tools:prepare]
    desc: Run all unit tests
    dir: '{{.TEST_DIR}}'
    cmds:
      - lua test_runner.lua
      - python -m unittest test_export_harness_selene.py
      - python -m unittest test_export_harness_luals.py
    sources:
      - '{{.SRC_DIR}}/**/*.lua'
      - '{{.TEST_DIR}}/**/*.lua'
      - '{{.TEST_DIR}}/**/*.py'

  test:single:
    desc: Run a single test file
    dir: '{{.TEST_DIR}}'
    cmds:
      - lua {{.CLI_ARGS}}
    requires:
      vars: [CLI_ARGS]

  test:watch:
    desc: Watch files and run tests on changes
    watch: true
    sources:
      - '{{.SRC_DIR}}/**/*.lua'
      - '{{.TEST_DIR}}/**/*.lua'
      - '{{.TEST_DIR}}/**/*.py'
    cmds:
      - task: test

  build:
    desc: Format then build Harness distribution artifacts
    cmds:
      - task: format
      - python build/scripts/build_single_lua_release.py
      - python build/scripts/stamp_harness_version.py
      - python build/scripts/export_harness_selene.py --src src --output dist/harness-selene.yml
      - python build/scripts/export_harness_luals.py --src src --output dist/harness.d.lua
    sources:
      - '{{.SRC_DIR}}/**/*.lua'
      - 'build/scripts/build_single_lua_release.py'
      - 'build/scripts/stamp_harness_version.py'
      - 'build/scripts/export_harness_selene.py'
      - 'build/scripts/export_harness_luals.py'
      - '.buildrc'
      - 'pyproject.toml'
    generates:
      - 'dist/harness.lua'
      - 'dist/harness-selene.yml'
      - 'dist/harness.d.lua'

  build:cd:
    desc: Build Harness distribution artifacts without formatting
    cmds:
      - python build/scripts/build_single_lua_release.py
      - python build/scripts/stamp_harness_version.py
      - python build/scripts/export_harness_selene.py --src src --output dist/harness-selene.yml
      - python build/scripts/export_harness_luals.py --src src --output dist/harness.d.lua
    sources:
      - '{{.SRC_DIR}}/**/*.lua'
      - 'build/scripts/build_single_lua_release.py'
      - 'build/scripts/stamp_harness_version.py'
      - 'build/scripts/export_harness_selene.py'
      - 'build/scripts/export_harness_luals.py'
      - '.buildrc'
      - 'pyproject.toml'
    generates:
      - 'dist/harness.lua'
      - 'dist/harness-selene.yml'
      - 'dist/harness.d.lua'

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.BUILD_DIR}}/*.lua

  lint:
    deps: [build:cd, tools:prepare]
    desc: Run Selene on build artifact
    cmds:
      - cmd: ./tools/selene/selene --allow-warnings --config selene.toml {{.BUILD_DIR}}/harness.lua
        platforms: [linux, darwin]
      - cmd: ./tools/selene/selene.exe --allow-warnings --config selene.toml {{.BUILD_DIR}}/harness.lua
        platforms: [windows]

  syntax:check:
    desc: Parse the build artifact with Lua 5.1
    cmds:
      - luac -p "{{.BUILD_DIR}}/harness.lua"

  complexity:check:
    desc: Report Lua complexity warnings
    preconditions:
      - sh: command -v uv
        msg: uv 0.10.12 is required to run complexity checks
    cmds:
      - uv run --locked --only-group quality python scripts/ci/lua_complexity.py {{.SRC_DIR}} {{.CLI_ARGS}}

  deps:lock:
    desc: Update the locked Python dependencies
    preconditions:
      - sh: command -v uv
        msg: uv 0.10.12 is required to update Python dependencies
    cmds:
      - uv lock

  format:
    desc: Format Lua sources with Stylua (vendored)
    cmds:
      - cmd: ./stylua/stylua src tests test_mission_scripts
        platforms: [linux, darwin]
      - cmd: ./stylua/stylua.exe src tests test_mission_scripts
        platforms: [windows]

  format:check:
    desc: Check formatting with Stylua (vendored)
    cmds:
      - cmd: ./stylua/stylua --check src tests test_mission_scripts
        platforms: [linux, darwin]
      - cmd: ./stylua/stylua.exe --check src tests test_mission_scripts
        platforms: [windows]

  coverage:
    desc: Run tests with coverage reporting
    dir: '{{.TEST_DIR}}'
    cmds:
      - lua -lluacov test_runner.lua
      - luacov
    sources:
      - '{{.SRC_DIR}}/**/*.lua'
      - '{{.TEST_DIR}}/**/*.lua'

  ci:
    desc: Run CI pipeline
    cmds:
      - task: format:check
      - task: lint
      - task: test
      - task: complexity:check
      - task: build:cd
      - task: syntax:check

  bump:patch:
    desc: Bump patch version and regenerate versioned files
    cmds:
      - python build/scripts/bump_version.py patch
      - task: deps:lock
      - task: build:cd

  bump:minor:
    desc: Bump minor version and regenerate versioned files
    cmds:
      - python build/scripts/bump_version.py minor
      - task: deps:lock
      - task: build:cd

  bump:major:
    desc: Bump major version and regenerate versioned files
    cmds:
      - python build/scripts/bump_version.py major
      - task: deps:lock
      - task: build:cd

  tag:
    desc: Create and push git tag from pyproject version
    cmds:
      - python build/scripts/tag_version.py

  release:
    desc: "Full release: bump version, commit, tag, and push (usage: task release -- patch)"
    vars:
      PART: '{{.CLI_ARGS | default "minor"}}'
    cmds:
      - task: ci
      - python build/scripts/bump_version.py {{.PART}}
      - task: deps:lock
      - task: build:cd
      - cmd: git add pyproject.toml CHANGELOG.md uv.lock dist/harness.lua dist/harness-selene.yml dist/harness.d.lua
      - cmd: 'git commit -m "Release v$(python -c "import re; from pathlib import Path; m=re.search(r''version\s*=\s*\"([\d.]+)\"'', Path(''pyproject.toml'').read_text()); print(m.group(1))")"'
      - cmd: git push origin HEAD
      - task: tag

  release:dry-run:
    desc: "Show what a release would do without executing (usage: task release:dry-run -- patch)"
    vars:
      PART: '{{.CLI_ARGS | default "minor"}}'
    cmds:
      - cmd: |
          set -e
          CURRENT=$(python -c "import re; from pathlib import Path; m=re.search(r'version\s*=\s*\"([\d.]+)\"', Path('pyproject.toml').read_text()); print(m.group(1))")
          NEXT=$(python -c "
          v='$CURRENT'.split('.')
          part='{{.PART}}'
          if part=='major': v=[str(int(v[0])+1),'0','0']
          elif part=='minor': v=[v[0],str(int(v[1])+1),'0']
          else: v=[v[0],v[1],str(int(v[2])+1)]
          print('.'.join(v))
          ")
          echo "Would bump {{.PART}}: $CURRENT -> $NEXT"
          echo "Would commit: Release v$NEXT"
          echo "Would push the release commit to origin"
          echo "Would tag: v$NEXT"
          echo "Would push tag to origin"
        platforms: [linux, darwin]

  help:
    desc: Show available tasks
    cmds:
      - task --list
